<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio de Thomas Montout, étudiant BTS SIO SLAM en alternance chez Coface. Projets E5 et E6, compétences et veille technologique."
    />
    <meta
      name="keywords"
      content="BTS SIO, SLAM, développement web, portfolio, projets E5, projets E6, développeur full-stack, Thomas Montout"
    />
    <meta name="author" content="Thomas Montout" />
    <title>Thomas Montout — Portfolio BTS SIO SLAM</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Open Graph : preview riche quand le lien est partagé (LinkedIn, Slack, Discord, WhatsApp…).
         og:image doit faire au moins 1200x630px pour un rendu correct sur LinkedIn.
         Pour l'instant on pointe sur la photo de profil. Tu pourras créer une vraie image OG plus tard. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Thomas Montout — Portfolio BTS SIO SLAM" />
    <meta
      property="og:description"
      content="Portfolio de Thomas Montout, étudiant BTS SIO SLAM en alternance chez Coface. Projets E5 et E6, compétences et veille technologique."
    />
    <meta property="og:image" content="/img/photos/herophoto.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Thomas Montout — Portfolio" />

    <!-- Twitter Card : équivalent pour Twitter/X. summary_large_image = image large à gauche du texte. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Thomas Montout — Portfolio BTS SIO SLAM" />
    <meta
      name="twitter:description"
      content="Portfolio de Thomas Montout, étudiant BTS SIO SLAM en alternance chez Coface."
    />
    <meta name="twitter:image" content="/img/photos/herophoto.png" />

    <!-- Theme color : couleur de la barre d'URL sur mobile (Chrome Android, Safari iOS). -->
    <meta name="theme-color" content="#561c24" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />
    <script src="https://kit.fontawesome.com/034bfcf0e5.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
